[project]
name = "proyectoexpensr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "ruff>=0.16.8",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "psycopg[binary]>=3.2",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx2>=2.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
