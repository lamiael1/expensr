services:
  postgres:
    image: postgres:17
    container_name: expensr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./expensr-backend
    container_name: expensr-backend
    env_file:
      - ./expensr-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./certs/baw-ca.pem:/run/certs/baw-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./expensr-frontend
      args:
        VITE_API_URL: /api
    container_name: expensr-frontend
    environment:
      BACKEND_HOST: backend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
