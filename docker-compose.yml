services:
  postgres:
    image: postgres:17
    container_name: expensr-postgres
    environment:
      POSTGRES_DB: expensr
      POSTGRES_USER: expensr
      POSTGRES_PASSWORD: expensr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensr -d expensr"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./expensr-backend
    container_name: expensr-backend
    env_file:
      - ./expensr-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://expensr:expensr@postgres:5432/expensr
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
