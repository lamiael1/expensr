
name: CI



on:

  push:

    branches: [main]

  pull_request:

    branches: [main]



jobs:

  lint:

    name: Lint (ruff)

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: expensr-backend

    steps:

      - uses: actions/checkout@v4



      - name: Instalar uv

        uses: astral-sh/setup-uv@v3

        with:

          version: "latest"



      - name: Instalar dependencias

        run: uv sync --frozen



      - name: ruff check

        run: uv run ruff check .



      - name: ruff format --check

        run: uv run ruff format --check .



  test:

    name: Tests (pytest)

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: expensr-backend

    steps:

      - uses: actions/checkout@v4



      - name: Instalar uv

        uses: astral-sh/setup-uv@v3

        with:

          version: "latest"



      - name: Instalar dependencias

        run: uv sync --frozen



      - name: Ejecutar tests

        run: uv run pytest -v

