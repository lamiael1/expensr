apiVersion: apps/v1
kind: Deployment
metadata:
  name: expensr-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expensr-frontend
  template:
    metadata:
      labels:
        app: expensr-frontend
    spec:
      containers:
        - name: frontend
          image: proyectoexpensr-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_HOST
              value: expensr-backend
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: expensr-frontend
spec:
  type: ClusterIP
  selector:
    app: expensr-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
