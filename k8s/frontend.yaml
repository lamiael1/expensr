apiVersion: apps/v1
kind: Deployment
metadata:
  name: expensr-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expensr-frontend
  template:
    metadata:
      labels:
        app: expensr-frontend
    spec:
      containers:
        - name: frontend
          image: proyectoexpensr-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: VITE_API_URL
              value: http://127.0.0.1:8001
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: expensr-frontend
spec:
  type: ClusterIP
  selector:
    app: expensr-frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
